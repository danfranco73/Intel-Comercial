<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ingresar · Codenoa Sales Coach</title>
    <link rel="stylesheet" href="/app.css">
  </head>
  <body data-surface="login">
    <main class="auth-layout">
      <section class="panel auth-card">
        <p class="eyebrow">Codenoa Sales Coach</p>
        <h1>Ingresar</h1>
        <p class="muted">Accedé con tu usuario autorizado. La información comercial está protegida por alcance.</p>
        <form id="loginForm">
          <label>
            Email
            <input id="loginEmail" type="email" autocomplete="username" required>
          </label>
          <label>
            Contraseña
            <input id="loginPassword" type="password" autocomplete="current-password" required>
          </label>
          <button id="loginButton" class="primary" type="submit">Ingresar</button>
          <p id="loginError" class="status error" role="alert"></p>
        </form>
      </section>
    </main>
    <script src="/login.js"></script>
  </body>
</html>
